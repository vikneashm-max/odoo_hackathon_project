version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dayflow_postgres
    restart: always
    environment:
      POSTGRES_DB: dayflow_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
